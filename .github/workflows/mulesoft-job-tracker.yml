name: MuleSoft Job Tracker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover jobs and rebuild tracker
        id: tracker
        env:
          GREENHOUSE_BOARDS: ${{ secrets.GREENHOUSE_BOARDS }}
          LEVER_BOARDS: ${{ secrets.LEVER_BOARDS }}
          JOB_RSS_URLS: ${{ secrets.JOB_RSS_URLS }}
        run: |
          python tracker.py | tee tracker-output.txt

      - name: Commit tracker changes
        run: |
          git config user.name "mulesoft-job-tracker[bot]"
          git config user.email "mulesoft-job-tracker[bot]@users.noreply.github.com"
          git add jobs.json MuleSoft_Job_Tracker.xlsx
          if git diff --cached --quiet; then
            echo "No tracker changes."
          else
            git commit -m "chore: update MuleSoft job tracker"
            git push
          fi

      - name: Create GitHub notification for new jobs
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '^NEW_JOB|' tracker-output.txt || true)
          if [ "$count" -gt 0 ]; then
            {
              echo "## New MuleSoft job(s) found"
              echo
              grep '^NEW_JOB|' tracker-output.txt | sed 's/^NEW_JOB|/- /'
              echo
              echo "The Excel tracker was updated by this workflow."
            } > issue-body.md
            gh issue create --title "New MuleSoft jobs found — $(date -u '+%Y-%m-%d %H:%M UTC')" --body-file issue-body.md --label "job-alert" || true
          fi

      - name: Upload tracker artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuleSoft_Job_Tracker
          path: MuleSoft_Job_Tracker.xlsx
          retention-days: 30
