name: MuleSoft Job Tracker

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort; use two cadences to improve resilience.
    - cron: "*/5 * * * *"
    - cron: "2 * * * *"

permissions:
  contents: write

concurrency:
  group: mulesoft-job-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 openpyxl

      - name: Collect and update tracker
        run: |
          set -o pipefail
          python tracker.py | tee tracker-output.txt
          grep '^SEARCH_RESULTS=' tracker-output.txt || true
          grep '^SOURCE_ERROR=' tracker-output.txt || true

      - name: Publish job summary
        run: |
          echo "## MuleSoft Job Tracker" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          grep '^NEW_JOBS=' tracker-output.txt || true
          grep '^-' tracker-output.txt >> "$GITHUB_STEP_SUMMARY" || echo "No new matching jobs." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit tracker changes
        run: |
          git config user.name "mulesoft-tracker[bot]"
          git config user.email "mulesoft-tracker[bot]@users.noreply.github.com"
          git add data/jobs.json MuleSoft_Job_Tracker.xlsx
          if git diff --cached --quiet; then
            echo "No tracker changes."
            exit 0
          fi
          git commit -m "chore: update MuleSoft job tracker"
          git push
